name: API Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'automation/api/**'
      - 'automation/utils/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'automation/api/**'

env:
  NODE_VERSION: '20'
  MONGODB_VERSION: '7.0'

jobs:
  api-tests:
    name: API Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Pull MongoDB image
        run: |
          for i in 1 2 3; do
            docker pull mongo:7.0 && break
            echo "Pull attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Start MongoDB replica set
        run: |
          docker run --name mongodb -d -p 27017:27017 \
            mongo:7.0 \
            mongod --replSet rs0 --bind_ip_all --noauth
          # Wait for mongod to accept connections
          timeout 30 bash -c 'until docker exec mongodb mongosh --quiet --eval "db.adminCommand({ping:1})" 2>/dev/null; do sleep 2; done'
          # Initialise the replica set with a single member
          docker exec mongodb mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          # Wait until this node becomes primary
          timeout 30 bash -c 'until docker exec mongodb mongosh --quiet --eval "rs.isMaster().ismaster" 2>/dev/null | grep -q true; do sleep 2; done'
          echo "MongoDB replica set rs0 ready"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            automation/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend server
        working-directory: backend
        env:
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/dinepos_test?replicaSet=rs0&directConnection=true
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-not-for-production' }}
          SUPER_ADMIN_JWT_SECRET: ${{ secrets.SUPER_ADMIN_JWT_SECRET || 'ci-test-sa-jwt-secret-not-for-production' }}
          REDIS_URL: redis://localhost:6379
          SUPER_ADMIN_ID: ${{ secrets.SUPER_ADMIN_ID || 'ci-superadmin' }}
          SUPER_ADMIN_PASS: ${{ secrets.SUPER_ADMIN_PASS || 'ci-superpass-1234' }}
          AGGREGATOR_SECRET: ${{ secrets.AGGREGATOR_SECRET || 'ci-aggregator-secret-not-for-production' }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY || 'c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1' }}
          NODE_ENV: test
        run: |
          npm start &
          echo $! > /tmp/backend.pid
          # Wait for server to be ready (unauthenticated liveness probe)
          timeout 60 bash -c 'until curl -sf http://localhost:5000/api/health/live; do sleep 2; done'

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Create test env file
        working-directory: automation
        run: |
          cat > .env.test << EOF
          TEST_API_URL=http://localhost:5000
          SUPER_ADMIN_ID=${{ secrets.SUPER_ADMIN_ID || 'ci-superadmin' }}
          SUPER_ADMIN_PASS=${{ secrets.SUPER_ADMIN_PASS || 'ci-superpass-1234' }}
          JWT_SECRET=${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-not-for-production' }}
          MONGODB_TEST_URI=mongodb://127.0.0.1:27017/dinepos_test?replicaSet=rs0&directConnection=true
          SOCKET_URL=http://localhost:5000
          DEFAULT_TIMEOUT=30000
          SOCKET_TIMEOUT=8000
          EOF

      - name: Run API tests
        working-directory: automation
        run: npm run test:api -- --forceExit
        env:
          CI: true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: |
            automation/reports/html/
            automation/reports/junit/
            automation/reports/coverage/
            automation/reports/logs/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          directory: automation/reports/coverage
          flags: api-tests

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi
