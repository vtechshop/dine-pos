name: Web (Playwright) Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'automation/web/**'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'automation/web/**'

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Pull MongoDB image
        run: |
          for i in 1 2 3; do
            docker pull mongo:7.0 && break
            echo "Pull attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Start MongoDB replica set
        run: |
          docker run --name mongodb -d -p 27017:27017 \
            mongo:7.0 \
            mongod --replSet rs0 --bind_ip_all --noauth
          timeout 30 bash -c 'until docker exec mongodb mongosh --quiet --eval "db.adminCommand({ping:1})" 2>/dev/null; do sleep 2; done'
          docker exec mongodb mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          timeout 30 bash -c 'until docker exec mongodb mongosh --quiet --eval "rs.isMaster().ismaster" 2>/dev/null | grep -q true; do sleep 2; done'
          echo "MongoDB replica set rs0 ready"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install and start backend
        working-directory: backend
        env:
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/dinepos_test?replicaSet=rs0&directConnection=true
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-not-for-production' }}
          SUPER_ADMIN_ID: ${{ secrets.SUPER_ADMIN_ID || 'ci-superadmin' }}
          SUPER_ADMIN_PASS: ${{ secrets.SUPER_ADMIN_PASS || 'ci-superpass-1234' }}
          NODE_ENV: test
          AGGREGATOR_SECRET: ${{ secrets.AGGREGATOR_SECRET || 'ci-aggregator-secret-not-for-production' }}
        run: |
          npm ci
          npm run build
          npm start &
          # 60s timeout — cold Ubuntu runners need extra time for MongoDB connection + index builds
          timeout 60 bash -c 'until curl -sf http://localhost:5000/api/health 2>/dev/null; do sleep 2; done'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and serve web app
        working-directory: web
        env:
          VITE_API_URL: http://localhost:5000/api
        run: |
          pnpm run build
          pnpm exec vite preview --port 3000 &
          timeout 30 bash -c 'until curl -sf http://localhost:3000 2>/dev/null; do sleep 2; done'

      - name: Install Playwright
        working-directory: automation
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Create test env
        working-directory: automation
        run: |
          cat > .env.test << EOF
          WEB_BASE_URL=http://localhost:3000
          TEST_API_URL=http://localhost:5000
          SUPER_ADMIN_ID=${{ secrets.SUPER_ADMIN_ID || 'ci-superadmin' }}
          SUPER_ADMIN_PASS=${{ secrets.SUPER_ADMIN_PASS || 'ci-superpass-1234' }}
          EOF
      # Admin credentials are self-provisioned by Playwright globalSetup — no secrets required.

      - name: Run Playwright tests
        working-directory: automation
        run: npm run test:web

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-reports
          path: |
            automation/reports/playwright-html/
            automation/reports/playwright/
          retention-days: 14
