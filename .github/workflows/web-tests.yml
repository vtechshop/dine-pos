name: Web (Playwright) Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'automation/web/**'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'automation/web/**'

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mongodb:
        image: public.ecr.aws/docker/library/mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install and start backend
        working-directory: backend
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/dinepos_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-not-for-production' }}
          SUPER_ADMIN_ID: ${{ secrets.SUPER_ADMIN_ID || 'ci-superadmin' }}
          SUPER_ADMIN_PASS: ${{ secrets.SUPER_ADMIN_PASS || 'ci-superpass-1234' }}
          NODE_ENV: test
          AGGREGATOR_SECRET: ${{ secrets.AGGREGATOR_SECRET || 'ci-aggregator-secret-not-for-production' }}
        run: |
          npm ci
          npm run build
          npm start &
          # 60s timeout — cold Ubuntu runners need extra time for MongoDB connection + index builds
          timeout 60 bash -c 'until curl -sf http://localhost:5000/api/health 2>/dev/null; do sleep 2; done'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and serve web app
        working-directory: web
        env:
          VITE_API_URL: http://localhost:5000/api
        run: |
          pnpm run build
          pnpm exec vite preview --port 3000 &
          timeout 30 bash -c 'until curl -sf http://localhost:3000 2>/dev/null; do sleep 2; done'

      - name: Install Playwright
        working-directory: automation
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Create test env
        working-directory: automation
        run: |
          cat > .env.test << EOF
          WEB_BASE_URL=http://localhost:3000
          TEST_API_URL=http://localhost:5000
          SUPER_ADMIN_ID=${{ secrets.SUPER_ADMIN_ID || 'ci-superadmin' }}
          SUPER_ADMIN_PASS=${{ secrets.SUPER_ADMIN_PASS || 'ci-superpass-1234' }}
          ADMIN_ID=${{ secrets.TEST_ADMIN_ID }}
          ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}
          EOF

      # TEST_ADMIN_ID / TEST_ADMIN_PASSWORD must be set as repository secrets.
      # These credentials must match a hotel admin that exists in the CI test database.
      # There is no automatic fallback — missing secrets cause login tests (WEB-002,
      # WEB-005, and all orders tests) to fail with an authentication error, which is
      # the intended signal that the secrets need to be configured.
      - name: Check web test credentials
        run: |
          MISSING=""
          [ -z "${{ secrets.TEST_ADMIN_ID }}" ]       && MISSING="$MISSING TEST_ADMIN_ID"
          [ -z "${{ secrets.TEST_ADMIN_PASSWORD }}" ]  && MISSING="$MISSING TEST_ADMIN_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error file=.github/workflows/web-tests.yml::Required secrets not set:$MISSING — WEB-002, WEB-005, and all order tests will fail. Add TEST_ADMIN_ID and TEST_ADMIN_PASSWORD to repository secrets."
          fi

      - name: Run Playwright tests
        working-directory: automation
        run: npm run test:web

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-reports
          path: |
            automation/reports/playwright-html/
            automation/reports/playwright/
          retention-days: 14
